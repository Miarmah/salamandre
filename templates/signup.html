{% extends "base.html" %}
{% block content %}
<div style="padding-top: 20px;">
  <a href="{{ url_for('onboarding') }}" class="icon-btn" style="margin-bottom:30px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </a>

  <div style="text-align:center; margin-bottom:26px;">
    <div class="logo-badge" style="width:80px;height:80px;border-radius:22px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
    </div>
    <h1 style="font-family:'Baloo 2',sans-serif; font-size:28px; font-weight:800; color:var(--green); margin:0;">Créer un compte</h1>
    <p style="color:var(--muted); margin-top:6px;">Rejoignez I-Music dès aujourd'hui !</p>
  </div>

  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

  <form method="POST">
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input type="text" name="username" placeholder="Nom d'utilisateur" value="{{ username }}" required>
    </div>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" opacity="0"/><path d="M4 4h16v16H4z"/><polyline points="4 4 12 13 20 4"/></svg>
      <input type="email" name="email" placeholder="Email" value="{{ email }}" required>
    </div>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input type="password" name="password" id="pwd" placeholder="Mot de passe" required>
      <button type="button" class="eye-toggle" onclick="togglePwd('pwd', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <p class="hint">🔒 Utilisez au moins 8 caractères</p>

    <button type="submit" class="btn">
      Créer mon compte
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
  </form>
  <p style="text-align:center; color:var(--muted); margin-top:18px;">Déjà inscrit ? <a class="link" href="{{ url_for('login') }}">Se connecter</a></p>
</div>
{% endblock %}
