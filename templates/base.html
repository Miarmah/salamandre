<!DOCTYPE html>
<html lang="fr" data-theme="{{ 'dark' if user and user['dark_mode'] else 'light' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I-Music</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="phone" id="phone-root">
  <div class="statusbar">
    <span id="clock">10:16</span>
    <!-- <span>●●● Wi‑Fi 🔋</span> -->
  </div>

  <div class="screen">
    {% block content %}{% endblock %}
  </div>

  {% if user and request.endpoint in ['library', 'catalog', 'timeline_page', 'playlists', 'settings', 'search_page', 'playlist_detail', 'stats'] %}
  <div id="mini-player" class="mini-player" style="display:none;" onclick="openPlayer()">
    <div class="mini-cover">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l10 6-10 6z"/></svg>
    </div>
    <div class="mini-title" id="mini-title">—</div>
    <button class="mini-play" id="mini-play-btn" onclick="event.stopPropagation(); togglePlay();">
      <svg id="mini-play-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item {{ 'active' if request.endpoint=='library' else '' }}" href="{{ url_for('library') }}" title="Bibliothèque">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V21H3z"/></svg>
    </a>
    <a class="nav-item {{ 'active' if request.endpoint in ['catalog','timeline_page'] else '' }}" href="{{ url_for('catalog') }}" title="Catalogue">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>
    </a>
    <a class="nav-item {{ 'active' if request.endpoint=='playlists' else '' }}" href="{{ url_for('playlists') }}" title="Playlists">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor"/></svg>
    </a>
    <a class="nav-item {{ 'active' if request.endpoint=='search_page' else '' }}" href="{{ url_for('search_page') }}" title="Recherche">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </a>
    <a class="nav-item {{ 'active' if request.endpoint=='settings' else '' }}" href="{{ url_for('settings') }}" title="Paramètres">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </nav>

  <!-- Full player overlay -->
  <div class="player-overlay" id="player-overlay">
    <div class="player-top">
      <button class="chevron" onclick="closePlayer()">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <span class="player-label">EN LECTURE</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>

    <div class="viz-wrap">
      <div class="now-cover" id="now-cover"></div>
      <canvas id="viz-canvas" width="300" height="240" style="width:100%;height:100%;"></canvas>
    </div>

    <div class="viz-modes">
      <button class="mode-btn active" data-mode="bars" onclick="setVizMode('bars')">▮ Barres</button>
      <button class="mode-btn" data-mode="wave" onclick="setVizMode('wave')">∿ Onde</button>
      <button class="mode-btn" data-mode="circle" onclick="setVizMode('circle')">◎ Cercle</button>
    </div>

    <div class="now-title" id="now-title">—</div>
    <div class="now-sub">Audio importé</div>

    <div class="progress-row">
      <input type="range" min="0" max="1000" value="0" class="progress-bar" id="seek" oninput="onSeekInput(this)">
    </div>
    <div class="time-row">
      <span id="time-current">0:00</span>
      <span id="time-duration">0:00</span>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn small-toggle" id="shuffle-btn" onclick="toggleShuffle()" title="Lecture aléatoire">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button class="ctrl-btn" onclick="prevTrack()" title="Précédent">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
      </button>
      <button class="ctrl-btn play" id="big-play-btn" onclick="togglePlay()">
        <svg id="big-play-icon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="nextTrack()" title="Suivant">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
      </button>
      <button class="ctrl-btn small-toggle" id="repeat-btn" onclick="toggleRepeat()" title="Répéter">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span id="repeat-one-badge" style="display:none;">1</span>
      </button>
    </div>
    <div class="queue-hint" id="queue-hint"></div>
  </div>
  {% endif %}

  <div class="modal-backdrop" id="add-playlist-modal" style="display:none;" onclick="if(event.target===this) closeAddToPlaylist()">
    <div class="modal-sheet">
      <div class="modal-title">Ajouter à une playlist</div>
      <div id="add-playlist-list" style="display:flex; flex-direction:column; gap:10px; max-height:260px; overflow-y:auto;">
        <p style="color:var(--muted);">Chargement…</p>
      </div>
      <button class="btn outline" style="margin-top:16px;" onclick="closeAddToPlaylist()">Fermer</button>
    </div>
  </div>

  <div class="modal-backdrop" id="rename-modal" style="display:none;" onclick="if(event.target===this) closeRename()">
    <div class="modal-sheet">
      <div class="modal-title">Renommer le morceau</div>
      <form id="rename-form" method="POST">
        <div class="field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
          <input type="text" name="title" id="rename-input" required>
        </div>
        <button type="submit" class="btn">Enregistrer</button>
      </form>
    </div>
  </div>
</div>

<audio id="audio-el" preload="metadata"></audio>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
